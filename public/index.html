<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment Retry Proof</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 860px; margin: 40px auto; padding: 0 20px; line-height: 1.45; }
    .card { border: 1px solid #ccc; border-radius: 12px; padding: 20px; margin: 16px 0; }
    button, select, input { font: inherit; padding: 8px 10px; margin: 4px; }
    pre { background: #f5f5f5; padding: 14px; overflow: auto; border-radius: 8px; }
    .muted { color: #666; }
  </style>
</head>
<body>
  <h1>Payment Retry Proof</h1>
  <p class="muted">
    A tiny brownfield demo showing whether focused repository context can guide a safe code change.
  </p>

  <div class="card">
    <h2>1. Create a payment</h2>
    <label>
      Amount
      <input id="amount" type="number" step="0.01" value="42.50">
    </label>
    <label>
      Outcome
      <select id="failureType">
        <option value="transient">Transient failure</option>
        <option value="permanent">Permanent failure</option>
        <option value="">Success</option>
      </select>
    </label>
    <button id="createBtn">Create payment</button>
  </div>

  <div class="card">
    <h2>2. Retry the current payment</h2>
    <button id="retryBtn" disabled>Retry payment</button>
  </div>

  <div class="card">
    <h2>Observed result</h2>
    <pre id="output">Create a payment to begin.</pre>
  </div>

  <script src="/app.js"></script>
</body>
</html>
